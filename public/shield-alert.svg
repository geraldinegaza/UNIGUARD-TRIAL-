<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ugShieldGrad" x1="20" y1="10" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="ugInnerGrad" x1="40" y1="30" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ugGoldGrad" x1="70" y1="50" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ugCyanGrad" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ugBevelGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="#0F172A" />

  <!-- Outer Protective Shield -->
  <path
    d="M 100 18 L 170 46 C 170 118 138 158 100 180 C 62 158 30 118 30 46 Z"
    fill="url(#ugShieldGrad)"
    stroke="url(#ugBevelGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner High-Contrast Core -->
  <path
    d="M 100 28 L 158 52 C 158 112 132 147 100 166 C 68 147 42 112 42 52 Z"
    fill="url(#ugInnerGrad)"
    stroke="#FFFFFF"
    stroke-opacity="0.25"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Radar Alert Arc -->
  <path
    d="M 76 68 C 90 56 110 56 124 68"
    stroke="url(#ugCyanGrad)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 'U' and 'G' Monogram -->
  <path
    d="M 64 78 V 110 C 64 134 78 146 100 146 C 122 146 136 134 136 110 V 78"
    stroke="url(#ugGoldGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M 136 106 H 108"
    stroke="url(#ugGoldGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- Center Warning Beacon Star -->
  <polygon
    points="100,80 104,91 115,91 106,98 109,109 100,102 91,109 94,98 85,91 96,91"
    fill="#FFFFFF"
  />
  <circle cx="100" cy="95" r="3" fill="#DC2626" />
</svg>
